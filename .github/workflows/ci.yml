name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: mobile, browser: chromium }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # Search e2e against the real Django API (backend search_demo fixture), no mocks.
  fullstack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick backend branch (same name if it exists, else trunk)
        id: backend
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/vmi-virtual-memorial/vmi-wd-backend.git "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=trunk" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: vmi-virtual-memorial/vmi-wd-backend
          ref: ${{ steps.backend.outputs.ref }}
          path: backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.fullstack.config.ts
        env:
          BACKEND_DIR: ${{ github.workspace }}/backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-fullstack
          path: playwright-report/
          retention-days: 7
